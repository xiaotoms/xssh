name: Update Free Proxy Subs
"on":
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00（北京时间 10:00）自动刷新
  workflow_dispatch:     # 支持手动触发

permissions:
  contents: write

concurrency:
  group: subs-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pyyaml

      - name: Run generator
        run: python proxy_hub.py --out subs --limit 8000

      - name: Commit subs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subs/
          git commit -m "chore: refresh subs $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: subs
          path: subs/
          if-no-files-found: error